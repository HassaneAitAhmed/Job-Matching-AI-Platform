name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest
      - name: Quick benchmark smoke run
        if: matrix.python-version == '3.12'
        run: python -m matching evaluate --quick --out build/BENCHMARKS.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t job-matching .
      - name: Container answers health check
        run: |
          docker run -d -p 8000:8000 --name app job-matching
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 2; done
          docker logs app; exit 1
