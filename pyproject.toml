[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-matching-ai"
version = "2.0.0"
description = "Job matching with A*, greedy best-first search, CSP and genetic algorithms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
]

[tool.setuptools]
packages = ["matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
